apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-telemetry-config
  namespace: home-stack-iot
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql.home-stack-db.svc.cluster.local:3306/home-stack
  SPRING_DATASOURCE_HIKARI_MINIMUM-IDLE: "2"
  SPRING_DATASOURCE_HIKARI_MAXIMUM-POOL-SIZE: "10"
  LOGGING_LEVEL_ROOT: WARN
  LOGGING_LEVEL_COM_ALOK: DEBUG
  LOGGING_LEVEL_COM_ZAXXER_HIKARI: INFO
  LOGGING_LEVEL_COM_ZAXXER_HIKARI_HIKARICONFIG: INFO
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORFK: INFO
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORFK_SECURITY: INFO

